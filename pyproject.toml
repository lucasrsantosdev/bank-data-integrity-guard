[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bank-data-integrity-guard"
version = "0.2.0"
description = "Deterministic financial snapshot verification POC using synthetic data"
requires-python = ">=3.11"
[project.scripts]
bankguard = "bankguard.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
